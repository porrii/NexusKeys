# Tuned for a low-memory host (3.77 GB RAM, 2 cores): the Flutter template
# default of -Xmx8G crashes the daemon with an OOM native allocation failure
# on this machine. Keep the daemon off so its heap is freed after every build.
# MaxMetaspaceSize needs enough headroom for release-build lint analysis
# (lintVitalAnalyzeRelease) across the whole plugin dependency graph — 384m
# was too tight and failed with an OOM there.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
